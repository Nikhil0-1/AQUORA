; PlatformIO Project Configuration File for AQUORA System 2 (Dispensing Machine)
; Target Hardware: ESP32-DevKitC / Custom Industrial Control PCB (5 Pumps, 5 Flow Sensors)

[platformio]
default_envs = esp32-dispensing-controller

[env:esp32-dispensing-controller]
platform = espressif32 @ ~6.5.0
board = esp32dev
framework = arduino

board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -I include
    -D CORE_DEBUG_LEVEL=3

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
