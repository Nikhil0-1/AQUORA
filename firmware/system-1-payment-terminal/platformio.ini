; PlatformIO Project Configuration File for AQUORA System 1 (Payment Terminal)
; Target Hardware: Elecrow CrowPanel 7.0-inch ESP32-S3 HMI (800x480 RGB LCD)

[platformio]
default_envs = esp32-s3-crowpanel-70

[env:esp32-s3-crowpanel-70]
platform = espressif32 @ ~6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; 16MB Flash, 8MB Octal PSRAM configuration
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D CORE_DEBUG_LEVEL=3

lib_deps =
    lvgl/lvgl @ ^8.3.11
    bblanchon/ArduinoJson @ ^7.0.4
    tamctec/TAMC_GT911 @ ^1.0.2
